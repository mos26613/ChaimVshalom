<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760">
  <!-- The little leaves scattered over the page background on large screens
       (css/style.css: "body::before" in the Wider screens block). This tile
       repeats across the page; its five leaves sit at uneven spots, tilts and
       sizes so they look loosely scattered. To make the leaves stronger or
       softer, change opacity below (0 = invisible, 1 = full color). -->
  <defs>
    <!-- One leaf sprig: pink center leaf, sage left leaf, lavender right leaf -->
    <g id="leaf">
      <path d="M0 -10 C4 -6 4 0 0 4 C-4 0 -4 -6 0 -10Z" fill="#e9b5af"/>
      <path d="M-1 4 C-5 3 -9 0 -10 -4 C-6 -3 -2 0 -1 4Z" fill="#bac9c1"/>
      <path d="M1 4 C5 3 9 0 10 -4 C6 -3 2 0 1 4Z" fill="#c4bad3"/>
    </g>
  </defs>
  <g opacity="0.42">
    <use href="#leaf" transform="translate(95 120) rotate(-20)"/>
    <use href="#leaf" transform="translate(615 65) rotate(15) scale(0.85)"/>
    <use href="#leaf" transform="translate(385 430) rotate(-5) scale(1.15)"/>
    <use href="#leaf" transform="translate(830 515) rotate(30) scale(0.9)"/>
    <use href="#leaf" transform="translate(175 650) rotate(10) scale(0.8)"/>
  </g>
</svg>
