# Site settings for Jekyll (the tool GitHub Pages uses to build the site).
# After changing this file, the live site rebuilds automatically on push.

title: "Chaim V'Shalom Women's Learning Center"

# The site's public web address, used for the "Share with a friend" link.
# The site has its own domain (see the CNAME file), so baseurl is empty.
url: "https://chaimvshalom.org"
baseurl: ""

# Files that are part of the project but should not be published on the website.
exclude:
  - README.md
  - SITE_PLAN.md
  - CLAUDE.md
  - tests
