# Lets you ask Claude for changes from GitHub: write "@claude" followed by a
# request in an issue (title or description), an issue comment, or a pull
# request comment. Only people with write access to the repository can trigger it.
# Requires the repository secret CLAUDE_CODE_OAUTH_TOKEN (see README).
name: Claude

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # Only start when the text actually mentions @claude
    if: >-
      (github.event_name == 'issues' &&
        (contains(github.event.issue.title, '@claude') || contains(github.event.issue.body, '@claude'))) ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
